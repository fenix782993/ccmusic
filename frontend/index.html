<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#050507"
  />

  <meta
    name="description"
    content="Fenix Music — твоя музыкальная вселенная"
  />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="Fenix Music"
  />

  <title>Fenix Music</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 100%;
      min-height: 100%;
    }

    html,
    body {
      background: #050507;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
      overflow-x: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <noscript>
    Для работы Fenix Music необходимо включить JavaScript.
  </noscript>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
