services:
  - type: web
    name: fenix-music
    runtime: node
    buildCommand: npm install && cd frontend && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-music-db
          property: connectionString

databases:
  - name: fenix-music-db
    plan: free
