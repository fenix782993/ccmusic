services:
  - type: web
    name: fenix-music-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-music-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: fenix-music-media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 10

databases:
  - name: fenix-music-db
    databaseName: fenixmusic
    user: fenix
