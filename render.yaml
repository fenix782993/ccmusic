services:
  - type: web
    name: fenix-music
    runtime: python
    plan: free

    buildCommand: "python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"

    startCommand: "python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ACCESS_MINUTES
        value: "10080"

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false
