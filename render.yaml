services:
  - type: web
    name: fenix-music-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-db
          property: connectionString
      - key: PORT
        value: 5000

databases:
  - name: fenix-db
    plan: free
    databaseName: fenix_music
    user: fenix_admin
