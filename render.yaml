services:
  - type: web
    name: fenix-music
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.run_all
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-music-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: FenixAdmin
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PUBLIC_URL
        sync: false

databases:
  - name: fenix-music-db
    databaseName: fenixmusic
    user: fenix
