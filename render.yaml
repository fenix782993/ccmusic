services:
  - type: web
    name: fenix-music
    runtime: python
    rootDir: .
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-music-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: fenix-music-media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 10

databases:
  - name: fenix-music-db
    databaseName: fenixmusic
    user: fenix
