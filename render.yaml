services:
  - type: web
    name: fenix-music
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=/opt/render/project/src python -m backend.run_all
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-music-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: FenixAdmin
      - key: MEDIA_DIR
        value: /opt/render/project/src/backend/media

databases:
  - name: fenix-music-db
    databaseName: fenixmusic
    user: fenix
