plugins { id 'com.android.application' }

android { namespace 'com.fenix.music'; compileSdk 35
    defaultConfig { applicationId 'com.fenix.music'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
    buildTypes { debug { minifyEnabled false } release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.activity:activity:1.9.3' }
